# ADR-0022 §2: the standalone Valkey the Redis contract tests run on, in CI.
# Not a deployment configuration.
#
# The container listens on every interface, but the host publishes the port
# on 127.0.0.1 only (start.sh), so the tests reach it at 127.0.0.1 (R1).
bind * -::*
port 6379
protected-mode yes

# Identities come only from the ACL file (ADR-0022 §4). users.acl is rendered
# from tests/Redis/command-inventory.php; never edit it by hand. start.sh
# appends the CI-step-only admin user at run time.
aclfile /etc/valkey/users.acl

# Disposable: no persistence.
save ""
appendonly no
