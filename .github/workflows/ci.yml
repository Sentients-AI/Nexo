name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The required status check: keep this name unchanged.
    name: PHP 8.5 / Laravel 13
    runs-on: ubuntu-latest

    # ADR-0009: every database test runs on MySQL 8.4. Reached at 127.0.0.1
    # through the mapped port, never by container hostname (C-12), so the
    # test database guard's host allowlist holds in CI too.
    services:
      mysql:
        image: mysql:8.4
        env:
          # A disposable CI container; not a credential for anything else.
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: nexo_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # The tests connect as nexo_test, privileged only on nexo\_testing%
    # (M6-D-03, .github/mysql/create-test-user.sql).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: nexo_test
      DB_PASSWORD: nexo_test
      NEXO_TEST_PRIVILEGES: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Create the test database user
        run: mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -pci-root-only < .github/mysql/create-test-user.sql

      # Evidence only. The privileges themselves are proven by
      # tests/Platform/TestUserPrivilegesTest.php.
      - name: Show MySQL version and test user grants
        run: mysql --protocol=TCP -h 127.0.0.1 -P 3306 -unexo_test -pnexo_test -e "SELECT VERSION(), CURRENT_USER(); SHOW GRANTS;"

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Audit dependencies
        run: composer audit

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Install frontend dependencies
        run: npm ci

      # The only frontend build in CI: the Inertia feature tests below
      # render @vite and need public/build/manifest.json.
      - name: Build frontend
        run: npm run build

      # Unit and feature tests in parallel: one database per process,
      # nexo_testing_test_<N>.
      - name: Run tests (parallel)
        run: php artisan test --parallel --processes=4 --testsuite=Unit,Feature

      # Guard proofs, privilege proofs and real worker processes, sequentially
      # (ADR-0009 §3, §3a).
      - name: Run platform and concurrency tests
        run: php artisan test --testsuite=Platform,Concurrency

  frontend:
    name: Node 24 / Vue 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Node version
        run: node --version && npm --version

      # engine-strict in .npmrc makes this fail on any Node other than ^24.15.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Last, so a newly published advisory does not hide the results above.
      - name: Audit production dependencies
        run: npm audit --omit=dev
